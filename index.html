<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>条件付き書式ジェネレータ | Google スプレッドシート & Excel</title>
<meta name="description" content="Google スプレッドシートと Excel の条件付き書式でよく使うパターンを選ぶだけで、設定手順とカスタム数式を自動生成するツールです。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='8' width='84' height='84' rx='12' fill='%23146b4a'/><rect x='22' y='22' width='26' height='16' fill='%23f6f3ea'/><rect x='52' y='22' width='26' height='16' fill='%23f2c14e'/><rect x='22' y='42' width='26' height='16' fill='%23f6f3ea'/><rect x='52' y='42' width='26' height='16' fill='%23f6f3ea'/><rect x='22' y='62' width='26' height='16' fill='%23e2725b'/><rect x='52' y='62' width='26' height='16' fill='%23f6f3ea'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="#">
      <span class="brand-mark" aria-hidden="true">
        <span></span><span class="c1"></span><span></span><span></span><span></span><span class="c2"></span>
      </span>
      <span class="brand-text">条件付き書式<em>ジェネレータ</em></span>
    </a>
    <div class="app-toggle" role="tablist" aria-label="対象アプリの切り替え">
      <button type="button" role="tab" data-app="sheets" aria-selected="true">
        <span class="dot dot-sheets" aria-hidden="true"></span>Google スプレッドシート
      </button>
      <button type="button" role="tab" data-app="excel" aria-selected="false">
        <span class="dot dot-excel" aria-hidden="true"></span>Excel
      </button>
    </div>
  </div>
</header>

<main>
  <div class="workbench">
    <aside class="patterns" id="patterns" aria-label="パターンの選択">
      <div class="section-head">
        <span class="step-no">1</span>
        <div>
          <h2>やりたいことを選ぶ</h2>
          <p>13種類の定番ルール</p>
        </div>
      </div>
      <nav id="pattern-groups" aria-label="条件付き書式のルール"></nav>
    </aside>

    <div class="workspace">
      <section class="workspace-empty" id="workspace-empty" aria-labelledby="workspace-empty-title">
        <div class="empty-sheet" aria-hidden="true">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
        <p class="empty-eyebrow">SELECT A RULE</p>
        <h2 id="workspace-empty-title">左のメニューから<br>やりたいことを選んでください</h2>
        <p>条件を入力すると、数式・設定手順・仕上がりイメージをここに表示します。</p>
      </section>

      <section class="config hidden" id="config" aria-label="条件の設定">
        <div class="section-head">
          <span class="step-no">2</span>
          <div>
            <h2>条件と色を設定する</h2>
            <p id="config-rule-title"></p>
          </div>
        </div>
        <form id="config-form" autocomplete="off"></form>
      </section>

      <section class="result hidden" id="result" aria-label="生成結果">
        <div class="section-head">
          <span class="step-no">3</span>
          <div>
            <h2>設定方法と数式</h2>
            <p>数式をコピーして、表示された手順どおりに設定してください。</p>
          </div>
        </div>

        <div class="result-grid">
          <div class="result-main">
            <div class="formula-card">
              <div class="formula-card-head">
                <span class="fx" aria-hidden="true">fx</span>
                <span id="formula-label">カスタム数式</span>
                <button type="button" id="copy-btn" class="copy-btn">コピー</button>
              </div>
              <code id="formula-output" class="formula-output"></code>
              <p id="formula-error" class="formula-error hidden"></p>
            </div>

            <div class="steps-card">
              <h3 id="steps-title"></h3>
              <ol id="steps-list"></ol>
            </div>
          </div>

          <aside class="result-side">
            <div class="preview-card">
              <h3>結果のイメージ</h3>
              <div id="preview" class="preview-sheet"></div>
            </div>
            <div class="notes-card hidden" id="notes-card">
              <h3>ヒント</h3>
              <ul id="notes-list"></ul>
            </div>
          </aside>
        </div>
      </section>
    </div>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
